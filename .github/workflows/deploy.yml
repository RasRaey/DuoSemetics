name: Deploy to GitHub Pages

# Deliberately manual. Publishing to GitHub Pages puts the built app on a
# public URL, which this repository being private does not change — so the
# deploy is triggered by hand rather than by every push.
#
# To publish: Settings -> Pages -> Source -> GitHub Actions (once), then run
# this workflow from the Actions tab. To go back to deploying automatically,
# uncomment the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [claude/tigrigna-learning-app-tiw5q3]

# Allow one concurrent deployment, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generates every lesson in the curriculum and asserts each is solvable.
      - run: npm run check:content
      # BASE_PATH must match the repository name for a project Pages site.
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
