name: Deploy to GitHub Pages

# Publishes the built app to https://rasraey.github.io/DuoSemetics/.
#
# A repository admin must enable Pages once, by hand:
#   Settings -> Pages -> Source -> GitHub Actions
#
# This cannot be automated. configure-pages has an `enablement: true` option,
# and it was tried twice — once while the repository was private, once after it
# was made public. Both failed identically with "Create Pages site failed:
# Resource not accessible by integration". GITHUB_TOKEN cannot create a Pages
# site whatever the permissions block says, and repository visibility makes no
# difference. Do not try a third time.
on:
  push:
    branches: [claude/tigrigna-learning-app-tiw5q3]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generates every lesson in the curriculum and asserts each is solvable.
      - run: npm run check:content
      # BASE_PATH must match the repository name for a project Pages site.
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
