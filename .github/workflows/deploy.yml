name: Deploy to GitHub Pages

# Publishes the built app to https://<user>.github.io/DuoSemetics/.
#
# That URL is public even though this repository is private — which is fine
# here: the app has no account, no server and no analytics, and all progress
# lives in localStorage on the device.
#
# One-time setup, which only a repository admin can do:
#   Settings -> Pages -> Source -> GitHub Actions
#
# This cannot be automated. configure-pages has an `enablement: true` option,
# but creating a Pages site needs admin rights that GITHUB_TOKEN does not have
# — it fails with "Resource not accessible by integration" no matter what the
# permissions block below says.
#
# Pages on a *private* repository also needs a paid plan. On the free plan the
# Settings page will say so, and the repository has to be public instead.
# Manual until Pages is enabled, so pushes don't pile up failed runs. Uncomment
# the push trigger once Settings -> Pages -> Source is set to GitHub Actions.
on:
  workflow_dispatch:
  # push:
  #   branches: [claude/tigrigna-learning-app-tiw5q3]

# Allow one concurrent deployment, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generates every lesson in the curriculum and asserts each is solvable.
      - run: npm run check:content
      # BASE_PATH must match the repository name for a project Pages site.
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
