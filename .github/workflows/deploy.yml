name: Deploy to GitHub Pages

# Publishes the built app to https://<user>.github.io/DuoSemetics/.
#
# That URL is public even though this repository is private — which is fine
# here: the app has no account, no server and no analytics, and all progress
# lives in localStorage on the device.
#
# `enablement: true` on configure-pages creates the Pages site itself using the
# pages:write permission below, so there is no manual Settings step. Note that
# Pages on a *private* repository needs a paid plan; on the free plan this step
# fails and the repository has to be public instead.
on:
  push:
    branches: [claude/tigrigna-learning-app-tiw5q3]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generates every lesson in the curriculum and asserts each is solvable.
      - run: npm run check:content
      # BASE_PATH must match the repository name for a project Pages site.
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
