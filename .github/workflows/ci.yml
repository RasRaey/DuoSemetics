name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generates every lesson in the curriculum and asserts each is solvable.
      - run: npm run check:content
      - run: npm run build
      # Plays two full lessons in Chromium at iPhone 15 Pro Max size.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
